// Crashlytics mints a fresh mapping-file id on every build, rekeying the
// resources -> R8 -> lint chain even for identical inputs. CI passes a
// deterministic id derived from the trees that feed R8; the uploaded mapping
// stays consistent because the upload task reads the id back from this
// resource. Local builds (env unset) keep the plugin behavior.
def deterministicMappingFileId = System.getenv("CESDK_AND_MAPPING_FILE_ID")
if (deterministicMappingFileId != null) {
    tasks.configureEach { task ->
        if (task.name.startsWith("injectCrashlyticsMappingFileId")) {
            // Part of the task identity: an id change must re-execute the task
            // (and re-key its cache entry), or stale ids would be restored.
            task.inputs.property("cesdkDeterministicMappingFileId", deterministicMappingFileId)
            task.doLast {
                def files = task.outputs.files.asFileTree
                    .matching { include "**/com_google_firebase_crashlytics_mappingfileid.xml" }
                    .files
                if (files.size() != 1) {
                    throw new GradleException(
                        "Expected exactly one mapping-file id resource in the outputs of ${task.name}, " +
                            "found ${files.size()} - the Crashlytics plugin layout changed, update this hook.",
                    )
                }
                def xmlFile = files.first()
                def rewritten = xmlFile.text.replaceAll(/>[0-9a-fA-F-]{30,40}</, ">${deterministicMappingFileId}<")
                if (!rewritten.contains(">${deterministicMappingFileId}<")) {
                    throw new GradleException(
                        "Could not inject the deterministic mapping-file id into ${xmlFile} - " +
                            "unexpected file content, update this hook.",
                    )
                }
                xmlFile.text = rewritten
            }
        }
    }
}

