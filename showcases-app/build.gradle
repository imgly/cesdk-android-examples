String getLocalProperty(String property) {
    def propertiesFile = new File(rootDir, "local.properties")
    if (!propertiesFile.exists()) return null
    def properties = new Properties()
    properties.load(propertiesFile.newDataInputStream())
    return properties.getProperty(property)
}

// Resolve BASE_URI: env var → local.properties → git branch.
// Auto-resolves from git branch for local and App Distribution builds so
// branch-deployed remote assets work without manual configuration (matching iOS).
// Play Store builds (UBQ_APP_DISTRIBUTION_BUILD=false) use the CDN default.
String resolveBaseUri() {
    def explicit = System.env.CESDK_AND_BASE_URI ?: getLocalProperty("base_uri")
    if (explicit) return explicit
    if (System.getenv("UBQ_APP_DISTRIBUTION_BUILD") == "false") return ""
    try {
        // providers.exec, not String.execute: starting a process directly at
        // configuration time is unsupported by the configuration cache.
        def git = providers.exec {
            commandLine "git", "rev-parse", "--abbrev-ref", "HEAD"
            workingDir = rootDir
            ignoreExitValue = true
        }
        if (git.result.get().exitValue != 0) return ""
        def branch = git.standardOutput.asText.get().trim()
        if (branch) return "https://ubique.img.ly/${branch}/packages/imgly/cesdk-android/assets"
    } catch (Exception ignored) {}
    return ""
}

Integer getVersionCode() {
    def versionPropsFile = file('.version')
    def versionProps = new Properties()
    versionProps.load(new FileInputStream(versionPropsFile))

    return versionProps.getProperty("code", "0").toInteger()
}

String getVersionName() {
    def versionPropsFile = file('.version')
    def versionProps = new Properties()
    versionProps.load(new FileInputStream(versionPropsFile))

    def year = versionProps.getProperty("year", "0").toInteger()
    def iteration = versionProps.getProperty("iteration", "0").toInteger()
    def currentVersion = "${year}.${iteration}"
    return currentVersion
}

def UBQ_ROOT_DIR = "${project.projectDir}/../../.."
def updateLocalizationTask = tasks.register("updateLocalizationFiles", Exec) {
    workingDir = UBQ_ROOT_DIR
    executable "bash"
    args = [
        "scripts/localization/android/generate_localization.sh",
        "scripts/localization/mobile-showcases.tsv",
        "apps/cesdk_android_showcases/showcases-app/src/main/res",
        "ly_img_showcases_"
    ]
}
// Bundle local assets for local dev and App Distribution builds, but not Play Store releases.
// Play Store builds (UBQ_APP_DISTRIBUTION_BUILD=false) use CDN assets at runtime.
def isPlayStoreBuild = System.getenv("UBQ_APP_DISTRIBUTION_BUILD") != null &&
    !System.getenv("UBQ_APP_DISTRIBUTION_BUILD").toBoolean()
if (isPlayStoreBuild) {
    tasks.named("preBuild").configure { dependsOn(updateLocalizationTask) }
} else {
    // Nothing in the showcases app reads the premium-templates source
    // (353 MB), so it is excluded from the bundle.
    def mobileAssetVersions = new Properties()
    file("${UBQ_ROOT_DIR}/mobile-asset-versions.env").withInputStream { mobileAssetVersions.load(it) }
    def assembleAssetsTask = tasks.register("assembleAssets", Exec) {
        def outputDir = "${projectDir}/src/main/assets/imgly-assets"
        workingDir = UBQ_ROOT_DIR
        commandLine "bash", "scripts/assemble-imgly-assets-bundle.sh", outputDir, "cesdk-android"
        environment "UBQ_EXCLUDE_PREMIUM_TEMPLATES", "true"
        inputs.property("excludePremiumTemplates", true)
        inputs.file("${UBQ_ROOT_DIR}/mobile-asset-versions.env")
        inputs.dir("${UBQ_ROOT_DIR}/assets/${mobileAssetVersions.getProperty('CESDK_ANDROID_DEFAULT_ASSETS_VERSION')}")
        inputs.dir("${UBQ_ROOT_DIR}/assets/demo/${mobileAssetVersions.getProperty('CESDK_ANDROID_DEMO_ASSETS_VERSION')}")
        outputs.dir(outputDir)
    }
    tasks.named("preBuild").configure { dependsOn(updateLocalizationTask, assembleAssetsTask) }
}
tasks.named("build").configure { dependsOn(updateLocalizationTask) }

android {
    def unsafeIsAppDistributionBuild = System.getenv("UBQ_APP_DISTRIBUTION_BUILD")
    def isLocalBuild = unsafeIsAppDistributionBuild == null
    def isAppDistributionBuild = unsafeIsAppDistributionBuild?.toBoolean() ?: false
    def versionCodeValue = (isAppDistributionBuild || isLocalBuild) ? 1 : getVersionCode()
    def versionNameValue
    if (isLocalBuild) {
        versionNameValue = "local"
    } else if (isAppDistributionBuild) {
        // The commit id must stay out of versionName: it flows into the merged
        // manifest -> resources -> R8, rekeying the whole app chain on every
        // commit. It lives in the release notes and the build-metadata asset
        // instead.
        versionNameValue = "${System.getenv("CESDK_AND_BRANCH_NAME")}"
    } else {
        versionNameValue = getVersionName()
    }

    def engineInternalDeploy = Boolean.parseBoolean(System.getenv("UBQ_ANDROID_INTERNAL_DEPLOY") ?: "true")
    def engineForceProductionLicense = Boolean.parseBoolean(System.getenv("UBQ_ANDROID_FORCE_PRODUCTION_LICENSE") ?: "false")

    namespace 'ly.img.editor.showcases'
    compileSdk libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        applicationId "ly.img.cesdk.catalog"
        minSdk libs.versions.androidMinSdk.get().toInteger()
        targetSdk libs.versions.androidTargetSdk.get().toInteger()
        versionCode versionCodeValue
        versionName versionNameValue
        manifestPlaceholders += [
            imglyEngineInternalDeploy: engineInternalDeploy,
            imglyEngineLogging: engineInternalDeploy,
            imglyEngineStagingLicense: engineInternalDeploy && !engineForceProductionLicense,
            imglyEngineTrackingEndpoint: System.getenv("CESDK_QA_TRACKING_ENDPOINT") ?: "",
        ]
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile rootProject.file("android-release.keystore")
            storePassword System.getenv("CESDK_AND_KEYSTORE_PWD") ?: getLocalProperty("release_key_password")
            keyAlias "cesdk-dev"
            keyPassword System.getenv("CESDK_AND_KEYSTORE_PWD") ?: getLocalProperty("release_key_password")
        }
    }

    flavorDimensions += "version"
    productFlavors {
        if (storeVariantEnabled) {
            store {
                dimension "version"
                // The Play Store build has to look exactly like a customer's
                // app: no on-canvas build version, no logging, production
                // license endpoint. It overrides defaultConfig, which is
                // env-driven for the internally distributed flavor.
                manifestPlaceholders += [
                    imglyEngineInternalDeploy: false,
                    imglyEngineLogging: false,
                    imglyEngineStagingLicense: false,
                    imglyEngineTrackingEndpoint: "",
                ]
            }
        }
        internal {
            dimension "version"
            applicationIdSuffix ".internal"
            if (firebaseEnabled) {
                firebaseAppDistribution {
                    artifactType = "APK"
                    releaseNotes = System.getenv("CESDK_AND_BRANCH_NAME") == null ? null :
                        "${System.getenv("CESDK_AND_BRANCH_NAME")} - ${System.getenv("CESDK_AND_COMMIT_ID")}"
                    groups = "internal"
                }
            }
        }
    }

    buildTypes {
        release {
            if (firebaseEnabled) {
                firebaseCrashlytics {
                    // Enable processing and uploading of native symbols to Firebase servers.
                    // By default, this is disabled to improve build speeds.
                    // This flag must be enabled to see properly-symbolicated native
                    // stack traces in the Crashlytics dashboard.
                    nativeSymbolUploadEnabled true
                }
            }
            def shrinkAndMinifyEnabled = System.getenv("CESDK_SHRINK_AND_MINIFY_ENABLED") == null
                || System.getenv("CESDK_SHRINK_AND_MINIFY_ENABLED") == "true"
            signingConfig signingConfigs.release
            minifyEnabled shrinkAndMinifyEnabled
            shrinkResources shrinkAndMinifyEnabled
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        compose true
    }
}

buildConfig {
    className "ShowcasesBuildConfig"
    packageName "ly.img.editor.showcases"

    buildConfigField String, "LICENSE", System.env.CESDK_APP_STORE_LICENSE ?: getLocalProperty("license") ?: ""
    buildConfigField String, "REMOTE_ASSET_SOURCE_HOST", System.env.CESDK_AND_REMOTE_ASSET_SOURCE_HOST ?: getLocalProperty("remote_asset_source_host") ?: ""
    buildConfigField String, "BASE_URI", resolveBaseUri()
    buildConfigField int, "VERSION_CODE", android.defaultConfig.versionCode ?: 0
    buildConfigField String, "VERSION_NAME", android.defaultConfig.versionName
    buildConfigField String, "ENGINE_VERSION", libs.versions.imgly.get()
}

