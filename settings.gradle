pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = "IMG.LY Artifactory"
                    url = "https://maven.img.ly/maven"
                }
            }
            filter {
                includeGroup("ly.img")
            }
        }
    }
}

rootProject.name = "CE.SDK Android Examples"
include ':examples-app'

// Marks this build as the standalone public examples project. examples-app reads this
// instead of inferring the mode from surrounding directory names, which breaks when a
// clone (or any sibling directory) is named cesdk_android_examples.
gradle.ext.ubqStandaloneExamplesProject = true

// Inside the IMG.LY monorepo, build the SDK from local source instead of Maven.
// Require the expected source checkout structure so an unrelated directory at
// the same path cannot accidentally enable composite-build substitution.
def editorDir = file("../../cesdk_android")
def hasLocalEditorSource = new File(editorDir, "settings.gradle").isFile() &&
        new File(editorDir, "sources/editor/build.gradle").isFile()
if (hasLocalEditorSource && System.getenv("UBQ_ANDROID_USE_ARTIFACTS") != "true") {
    includeBuild(editorDir) {
        dependencySubstitution {
            substitute module('ly.img:editor') using project(':editor')
            substitute module('ly.img:plugin-background-removal') using project(':plugin-background-removal')
            substitute module('ly.img:plugin-background-removal-imgly') using project(':plugin-background-removal-imgly')
            substitute module('ly.img:plugin-background-removal-google') using project(':plugin-background-removal-google')
            substitute module('ly.img:plugin-ai-image-generation') using project(':plugin-ai-image-generation')
            substitute module('ly.img:plugin-auto-captions') using project(':plugin-auto-captions')
            substitute module('ly.img:camera') using project(':camera')
            // Unlike showcases, keep the dummy debug menu: the released artifacts customers
            // resolve use it, and the real menu changes the SDK modules' classpaths between
            // the monorepo and composite builds, forcing spurious recompiles.
            substitute module('ly.img:editor-debug-menu-dummy') using project(':editor-debug-menu-dummy')
        }
    }
}
