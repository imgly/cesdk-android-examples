import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.github.gmazzo.buildconfig'
}

// The public export places the guide directories at the project root, while the monorepo keeps
// them next to the Android project. The export also copies every starter kit's optional dependency
// script next to this app so those merged sources keep compiling as starter kits evolve.
// The standalone mode is declared by the public settings.gradle rather than inferred from
// directory names; in the monorepo (and in composite-included builds) the flag is absent.
def isStandaloneExamplesProject = gradle.ext.has('ubqStandaloneExamplesProject')
if (isStandaloneExamplesProject) {
    (file("$projectDir/starter-kit-dependencies").listFiles() ?: [])
        .findAll { dependencyFile -> dependencyFile.file && dependencyFile.name.endsWith('.gradle') }
        .sort { dependencyFile -> dependencyFile.name }
        .each { dependencyFile -> apply from: dependencyFile }
} else {
    def starterKitsGradleFilePath = "$rootDir/../cesdk_android_showcases/starter-kits/starter-kits-local.gradle"
    if (file(starterKitsGradleFilePath).exists()) {
        apply from: starterKitsGradleFilePath
    }
}

def guideAssetsVersion = isStandaloneExamplesProject
    ? libs.versions.engine.get()
    : file("$rootDir/../../.ubq-version").text.trim()

String getLocalProperty(String property) {
    def propertiesFile = new File(rootDir, "local.properties")
    if (!propertiesFile.exists()) return null
    def properties = new Properties()
    properties.load(propertiesFile.newDataInputStream())
    return properties.getProperty(property)
}

android {
    namespace = "ly.img.editor.examples"
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    def engineInternalDeploy = Boolean.parseBoolean(System.getenv("UBQ_ANDROID_INTERNAL_DEPLOY") ?: "false")
    def engineForceProductionLicense = Boolean.parseBoolean(System.getenv("UBQ_ANDROID_FORCE_PRODUCTION_LICENSE") ?: "false")

    defaultConfig {
        applicationId = "ly.img.editor.guides"
        minSdk = libs.versions.androidMinSdk.get().toInteger()
        targetSdk = libs.versions.androidTargetSdk.get().toInteger()
        versionCode = 1
        versionName = "local"
        manifestPlaceholders += [
            imglyEngineInternalDeploy: engineInternalDeploy,
            imglyEngineLogging: engineInternalDeploy,
            imglyEngineStagingLicense: engineInternalDeploy && !engineForceProductionLicense,
            imglyEngineTrackingEndpoint: System.getenv("CESDK_QA_TRACKING_ENDPOINT") ?: "",
        ]
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file("android-release.keystore")
            storePassword System.getenv("CESDK_AND_KEYSTORE_PWD") ?: getLocalProperty("release_key_password")
            keyAlias "cesdk-dev"
            keyPassword System.getenv("CESDK_AND_KEYSTORE_PWD") ?: getLocalProperty("release_key_password")
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Nothing consumes the extracted symbol outputs: this app has no
            // Crashlytics and never ships through Play.
            ndk {
                debugSymbolLevel 'none'
            }
        }
        debug {
            // Keep default debug settings
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose = true
        buildConfig = false
    }

    sourceSets {
        main {
            def guidePatterns = ['engine-guides-', 'editor-guides-', 'camera-guides-']
            def blacklist = ['editor-guides-quickstart']
            def examplesDir = isStandaloneExamplesProject ? "$projectDir/.." : "$projectDir/../../cesdk_android_examples"
            file(examplesDir).listFiles().findAll { file ->
                file.directory && !blacklist.contains(file.name) && guidePatterns.any { pattern ->
                    file.name.startsWith(pattern)
                }
            }.each { dir ->
                kotlin.srcDirs += dir
                def assetsDir = file("$dir/assets")
                if (assetsDir.exists()) {
                    assets.srcDirs += assetsDir
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
        languageVersion = KotlinVersion.KOTLIN_1_9
        apiVersion = KotlinVersion.KOTLIN_1_9
    }
}

buildConfig {
    className "ExamplesBuildConfig"
    packageName "ly.img.editor.examples"
    buildConfigField String, "LICENSE", System.env.CESDK_APP_STORE_LICENSE ?: getLocalProperty("license") ?: ""
    buildConfigField String, "AI_GATEWAY_API_KEY", System.env.CESDK_AI_GATEWAY_API_KEY ?: getLocalProperty("ai_gateway_api_key") ?: ""
    buildConfigField String, "GUIDE_ADD_BUTTON_BASE_URI", "https://cdn.img.ly/packages/imgly/cesdk-android/$guideAssetsVersion/assets"
}

dependencies {
    // Use local SDK modules in the monorepo and their Maven equivalents in the public export.
    if (!isStandaloneExamplesProject) {
        implementation project(':editor')
        implementation project(':camera')
        implementation project(':plugin-ai-image-generation')
        implementation project(':plugin-auto-captions')
        implementation project(':plugin-background-removal-imgly')
        implementation project(':plugin-background-removal-google')
    } else {
        implementation libs.cesdk.editor
        implementation libs.cesdk.camera
        implementation libs.cesdk.plugin.ai.image.generation
        implementation libs.cesdk.plugin.auto.captions
        implementation libs.cesdk.plugin.background.removal.imgly
        implementation libs.cesdk.plugin.background.removal.google
    }
    implementation libs.cesdk.engine
    implementation libs.cesdk.engine.camera

    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.view
    implementation libs.camera.lifecycle
    implementation libs.camera.video

    def composeBom = platform(libs.compose.bom)
    implementation composeBom
    implementation libs.compose.material3
    implementation libs.compose.navigation

    androidTestImplementation composeBom
    androidTestImplementation libs.test.androidx.runner
    androidTestImplementation libs.compose.test.junit4
    androidTestImplementation libs.espresso.core
    debugImplementation libs.compose.test.manifest
}

// Kotlin compiler tries to compile kts files that are in src/java or src/kotlin.
// Since we do have such files for guides, these files need to be ignored.
tasks.withType(KotlinCompile).configureEach {
    exclude("**/*.gradle.kts")
}
