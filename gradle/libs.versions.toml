[versions]
androidMinSdk = "24"
androidMinCompileSdk = "34"
androidCompileSdk = "37"
androidTargetSdk = "37"
kotlin = "1.9.10"
composePlugin = "2.2.10"
okhttp = "4.10.0"
camera = "1.5.0-alpha04" # Using an alpha version as the last stable version (1.3.4) has a bug where the front camera ouptut is inverted
engine = "1.85.1-rc.0"
buildConfig = "6.0.10"
dropshots = "0.6.0"
gradleAndroid = "9.1.1"
# AGP's bundled 0.8.12 has no filters for Compose or Kotlin 1.9 bytecode.
jacoco = "0.8.15"
googleServices = "4.4.2"
exoplayerVersion = "1.3.1"
gradleCrashlytics = "3.0.2"
appDistributionPlugin = "5.3.0"
coreKtx = "1.9.0"
installer = "0.7.6"
dokka = "1.9.0"
segmentationSelfie = "16.0.0-beta6"
onnxRuntime = "1.26.0"

[libraries]
cesdk-engine = { group = "ly.img", name = "engine", version.ref = "engine" }
cesdk-engine-camera = { group = "ly.img", name = "engine-camera", version.ref = "engine" }
cesdk-editor = { group = "ly.img", name = "editor", version.ref = "engine" }
cesdk-camera = { group = "ly.img", name = "camera", version.ref = "engine" }
cesdk-plugin-ai-image-generation = { group = "ly.img", name = "plugin-ai-image-generation", version.ref = "engine" }
cesdk-plugin-auto-captions = { group = "ly.img", name = "plugin-auto-captions", version.ref = "engine" }
cesdk-plugin-background-removal-imgly = { group = "ly.img", name = "plugin-background-removal-imgly", version.ref = "engine" }
cesdk-plugin-background-removal-google = { group = "ly.img", name = "plugin-background-removal-google", version.ref = "engine" }

kotlin-coroutines = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

androidx-activity = "androidx.activity:activity:1.7.0"
androidx-fragment = "androidx.fragment:fragment:1.8.9"
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

compose-bom = "androidx.compose:compose-bom:2023.05.01"
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui-util = { module = "androidx.compose.ui:ui-util" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-activity = "androidx.activity:activity-compose:1.6.1"
compose-navigation = "androidx.navigation:navigation-compose:2.8.9"
compose-viewmodel = "androidx.lifecycle:lifecycle-viewmodel-compose:2.5.1"
compose-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

firebase-bom = "com.google.firebase:firebase-bom:34.19.0"
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

coil-compose = "io.coil-kt:coil-compose:2.6.0"
coil-video = "io.coil-kt:coil-video:2.6.0"

play-services-auth = "com.google.android.gms:play-services-auth:21.2.0"

shimmer = "com.valentinilk.shimmer:compose-shimmer:1.0.5"

camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camera" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camera" }

test-androidx-runner = { group = "androidx.test", name = "runner", version.strictly = "1.5.2" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "exoplayerVersion" }

installer = { module = "ru.solrudev.ackpine:ackpine-core",  version.ref = "installer" }
installer-ktx = { module = "ru.solrudev.ackpine:ackpine-ktx",  version.ref = "installer" }

concurrent-futures-ktx = "androidx.concurrent:concurrent-futures-ktx:1.2.0"
guava = "com.google.guava:guava:32.1.3-android"

espresso-core = "androidx.test.espresso:espresso-core:3.4.0"
espresso-intents = "androidx.test.espresso:espresso-intents:3.4.0"
uiautomator = "androidx.test.uiautomator:uiautomator:2.3.0"
junit = "junit:junit:4.13.2"
# `org.json` is stubbed in android.jar; unit tests that parse JSON need the real implementation.
json = "org.json:json:20231013"


data-store = "androidx.datastore:datastore-preferences:1.1.3"

segmentation-selfie = { module = "com.google.mlkit:segmentation-selfie", version.ref = "segmentationSelfie" }
onnxRuntime = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxRuntime" }
