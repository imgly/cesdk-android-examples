[versions]
androidMinSdk = "24"
androidMinCompileSdk = "34"
androidCompileSdk = "37"
androidTargetSdk = "37"
composePlugin = "2.2.10"
okhttp = "4.10.0"
imgly = "1.83.0-rc.1"
buildConfig = "6.0.10"
dropshots = "0.6.0"
gradleAndroid = "9.1.1"
googleServices = "4.4.2"
gradleCrashlytics = "3.0.2"
appDistributionPlugin = "5.3.0"
coreKtx = "1.15.0"
appcompat = "1.7.0"
installer = "0.7.6"
segmentationSelfie = "16.0.0-beta6"
onnxRuntime = "1.26.0"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
imgly-editor = { module = "ly.img:editor", version.ref = "imgly" }
imgly-plugin-background-removal-imgly = { module = "ly.img:plugin-background-removal-imgly", version.ref = "imgly" }
imgly-plugin-ai-image-generation = { module = "ly.img:plugin-ai-image-generation", version.ref = "imgly" }
imgly-plugin-auto-captions = { module = "ly.img:plugin-auto-captions", version.ref = "imgly" }
imgly-camera = { module = "ly.img:camera", version.ref = "imgly" }
editor-debug-menu = { module = "ly.img:editor-debug-menu", version.ref = "imgly" }
editor-debug-menu-dummy = { module = "ly.img:editor-debug-menu-dummy", version.ref = "imgly" }

compose-bom = "androidx.compose:compose-bom:2023.05.01"
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-activity = "androidx.activity:activity-compose:1.6.1"
compose-navigation = "androidx.navigation:navigation-compose:2.5.3"
compose-viewmodel = "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"

firebase-bom = "com.google.firebase:firebase-bom:34.19.0"
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-crashlytics-ndk = { module = "com.google.firebase:firebase-crashlytics-ndk" }

coil-compose = "io.coil-kt:coil-compose:2.2.2"
coil-svg = "io.coil-kt:coil-svg:2.2.2"

play-services-auth = "com.google.android.gms:play-services-auth:21.2.0"

material = "com.google.android.material:material:1.12.0"

installer = { module = "ru.solrudev.ackpine:ackpine-core", version.ref = "installer" }
installer-ktx = { module = "ru.solrudev.ackpine:ackpine-ktx", version.ref = "installer" }

core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
segmentation-selfie = { module = "com.google.mlkit:segmentation-selfie", version.ref = "segmentationSelfie" }
onnxRuntime = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxRuntime" }

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composePlugin" }
